task_type: detection
input_dataset: coco
dataloader:
  name: image_files_dataloader
  path: ./data/datasets/vision/barcode_images #from edgeai-gst-apps-barcode-reader repo
preprocess:
  resize: 416
  crop: 416
  data_layout: NCHW
  reverse_channels: true
  backend: cv2
  interpolation: null
  resize_with_pad: false
  pad_color:
  - 114
  - 114
  - 114
session:
  session_name: onnxrt
  target_device: AM62A
  input_optimization: true
  input_data_layout: NCHW
  input_mean: 
  - 0
  - 0
  - 0
  input_scale: 
  - 1
  - 1
  - 1
  runtime_options:
    # advanced_options:quantization_scale_type: 4
    tensor_bits: 8
    accuracy_level: 1
    advanced_options:high_resolution_optimization: 0
    advanced_options:pre_batchnorm_fold: 1
    advanced_options:calibration_frames: 12
    advanced_options:calibration_iterations: 12
    advanced_options:activation_clipping: 1
    advanced_options:weight_clipping: 1
    advanced_options:bias_calibration: 1
    advanced_options:output_feature_16bit_names_list: 1213, 1212, 1211, 1197, 1196, 1195, 1181, 1180, 1179
    advanced_options:params_16bit_names_list: ''
    advanced_options:add_data_convert_ops: 0
    object_detection:meta_arch_type: 6
    object_detection:meta_layers_names_list: yolox-nano-barcode-detection.prototxt
  model_path: yolox-nano-barcode-detection.onnx
  model_id: od-8209
  input_details: null
  output_details: null
  num_inputs: 1
postprocess:
  reshape_list:
  - - -1
    - 5
  - - -1
    - 1
  formatter:
    src_indices:
    - 5
    - 4
    dst_indices:
    - 4
    - 5
    name: DetectionBoxSL2BoxLS
  resize_with_pad: true
  normalized_detections: false
  shuffle_indices: null
  squeeze_axis: null
  ignore_index: null
  logits_bbox_to_bbox_ls: false
  keypoint: false
  object6dpose: false
metric:
  label_offset_pred:
    0: 0
model_info:
  metric_reference:
    accuracy_ap[.5:.95]%: 50.0
  model_shortlist: 10
  compact_name: yolox-nano-lite-modelmaker-barcode-416x416
  shortlisted: false
  recommended: false
common:
  surgery: 
    simplify_model: 0
    simplify_mode: 0
    model_surgery: 0
  task_type: detection